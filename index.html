<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Perro galáctico — HyperFrames</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #040518; }
    #stage {
      width: 1920px; height: 1080px; position: relative; overflow: hidden;
      background: radial-gradient(circle at 70% 34%, #35229b 0%, #141254 24%, #070b2f 52%, #020313 100%);
      color: #fff; font-family: Arial, sans-serif;
    }
    .nebula { position:absolute; width:1050px; height:680px; border-radius:50%; filter:blur(45px); opacity:.72; mix-blend-mode:screen; }
    .nebula.a { left:-210px; top:290px; background:radial-gradient(ellipse,#ff4385 0%,#8226dd 37%,transparent 70%); animation: driftA 5s ease-in-out both; }
    .nebula.b { right:-250px; top:-180px; background:radial-gradient(ellipse,#25d7ff 0%,#2169c7 40%,transparent 70%); animation: driftB 5s ease-in-out both; }
    .planet { position:absolute; right:105px; bottom:-200px; width:790px; height:790px; border-radius:50%; background:radial-gradient(circle at 35% 29%,#b2eaff 0%,#4489e8 17%,#192f93 47%,#070e44 74%); box-shadow:inset -90px -80px 130px rgba(0,0,0,.58), 0 0 80px #388cff; animation: planetFloat 5s ease-in-out both; }
    .ring { position:absolute; right:18px; bottom:93px; width:970px; height:240px; border:30px solid rgba(197,245,255,.55); border-radius:50%; transform:rotate(-17deg); box-shadow:0 0 30px rgba(67,215,255,.72); animation:ringSpin 5s ease-in-out both; }
    .star { position:absolute; width:4px; height:4px; border-radius:50%; background:#fff; box-shadow:0 0 11px 2px rgba(174,229,255,.9); animation:twinkle 1.8s ease-in-out infinite alternate; }
    .s1{left:120px;top:126px}.s2{left:312px;top:278px;animation-delay:.4s}.s3{left:560px;top:130px;animation-delay:.9s}.s4{left:773px;top:248px;animation-delay:.3s}.s5{left:1026px;top:105px;animation-delay:1.2s}.s6{left:1214px;top:304px;animation-delay:.6s}.s7{left:1460px;top:155px;animation-delay:1.1s}.s8{left:1730px;top:394px;animation-delay:.2s}.s9{left:180px;top:756px;animation-delay:.8s}.s10{left:443px;top:883px;animation-delay:1.3s}.s11{left:830px;top:750px;animation-delay:.1s}.s12{left:1110px;top:870px;animation-delay:.7s}
    .dog-wrap { position:absolute; left:510px; top:198px; width:760px; height:690px; transform-origin:50% 70%; animation: dogFly 5s cubic-bezier(.25,.7,.3,1) both; }
    .aura { position:absolute; left:103px; top:22px; width:553px; height:553px; border-radius:50%; background:radial-gradient(circle,rgba(78,236,255,.86) 0%,rgba(98,84,255,.34) 35%,rgba(254,68,176,.15) 55%,transparent 71%); filter:blur(16px); animation:auraPulse 5s ease-in-out both; }
    .dog-head { position:absolute; left:233px; top:139px; width:315px; height:310px; border-radius:45% 45% 48% 48%; background:linear-gradient(140deg,#efc999 0%,#b87d57 50%,#75432e 100%); box-shadow:inset -30px -30px 45px rgba(48,18,30,.4),0 20px 36px rgba(0,0,0,.35); }
    .ear { position:absolute; top:35px; width:130px; height:225px; background:linear-gradient(150deg,#bc7b58,#623747); border-radius:82% 30% 70% 34%; box-shadow:inset 17px 10px 25px rgba(255,180,156,.15); }
    .ear.left { left:189px; transform:rotate(-29deg); }.ear.right { right:178px; transform:scaleX(-1) rotate(-29deg); }
    .muzzle { position:absolute; left:282px; top:299px; width:215px; height:135px; border-radius:48% 48% 52% 52%; background:linear-gradient(160deg,#f5d6b4,#b97c5f); box-shadow:inset -12px -13px 20px rgba(70,31,38,.2); }
    .nose { position:absolute; left:355px; top:322px; width:70px; height:50px; border-radius:50% 50% 45% 45%; background:#241a2b; box-shadow:inset 0 4px 8px rgba(255,255,255,.18); }
    .eye { position:absolute; top:260px; width:52px; height:62px; border-radius:50%; background:#101325; border:9px solid #e8c6a1; box-shadow:0 0 16px #62efff, inset 0 0 10px #42dffc; }
    .eye:after { content:""; position:absolute; width:17px; height:17px; border-radius:50%; background:#fff; left:9px; top:6px; }.eye.left{left:294px}.eye.right{left:438px}
    .body { position:absolute; left:205px; top:414px; width:365px; height:220px; border-radius:48% 48% 35% 35%; background:linear-gradient(145deg,#d49a6c,#754052); box-shadow:inset -25px -20px 40px rgba(29,17,55,.4),0 24px 32px rgba(0,0,0,.3); }
    .leg { position:absolute; top:570px; width:78px; height:115px; border-radius:35px; background:linear-gradient(#c98e66,#6d4054); }.leg.l1{left:265px}.leg.l2{left:432px}
    .cape { position:absolute; left:449px; top:420px; width:265px; height:254px; background:linear-gradient(135deg,#ff2b87,#7f3dff 58%,transparent 59%); clip-path:polygon(0 0,100% 12%,66% 100%,5% 74%); filter:drop-shadow(0 12px 12px rgba(81,19,162,.42)); animation:capeWave 5s ease-in-out both; }
    .helmet { position:absolute; left:188px; top:84px; width:408px; height:386px; border:13px solid rgba(109,238,255,.85); border-radius:48%; background:radial-gradient(circle at 34% 20%,rgba(255,255,255,.34),rgba(108,215,255,.08) 35%,rgba(54,40,143,.1) 66%,transparent 70%); box-shadow:inset 10px 8px 28px rgba(175,254,255,.36),0 0 32px rgba(41,231,255,.82); animation:helmetGlow 5s ease-in-out both; }
    .collar { position:absolute; left:261px; top:434px; width:262px; height:29px; border-radius:50%; background:linear-gradient(90deg,#ffef65,#ff8d36,#ffef65); box-shadow:0 0 18px #ffb439; }
    .tag { position:absolute; left:372px; top:452px; width:42px; height:42px; border-radius:50%; background:#ffdd58; box-shadow:0 0 14px #ffe98e; }
    .title { position:absolute; left:0; right:0; bottom:80px; text-align:center; letter-spacing:10px; font-size:29px; font-weight:700; text-transform:uppercase; color:#d4f8ff; text-shadow:0 0 18px #56d3ff; opacity:0; animation:titleIn 5s ease both; }
    .caption { position:absolute; left:0; right:0; top:73px; text-align:center; font-size:20px; letter-spacing:7px; color:rgba(255,255,255,.78); opacity:0; animation:captionIn 5s ease both; }
    @keyframes twinkle { from {opacity:.25;transform:scale(.65)} to {opacity:1;transform:scale(1.35)} }
    @keyframes driftA { from{transform:translate(-100px,85px) scale(.8);opacity:0} to{transform:translate(0,0) scale(1);opacity:.72} }
    @keyframes driftB { from{transform:translate(110px,-80px) scale(.75);opacity:0} to{transform:translate(0,0) scale(1);opacity:.72} }
    @keyframes planetFloat { 0%{transform:translate(160px,180px) scale(.75);opacity:0} 35%{opacity:1} 100%{transform:translate(0,0) scale(1);opacity:1} }
    @keyframes ringSpin { 0%{transform:translate(150px,110px) rotate(-35deg);opacity:0} 100%{transform:translate(0,0) rotate(-17deg);opacity:1} }
    @keyframes dogFly { 0%{transform:translateY(155px) scale(.52) rotate(-10deg);opacity:0} 28%{opacity:1} 58%{transform:translateY(-18px) scale(1.04) rotate(2deg)} 100%{transform:translateY(0) scale(1) rotate(0)} }
    @keyframes auraPulse { 0%,100%{transform:scale(.82);opacity:.35} 54%{transform:scale(1.1);opacity:1} }
    @keyframes helmetGlow { 0%,100%{opacity:.35;transform:scale(.88)} 50%{opacity:1;transform:scale(1)} }
    @keyframes capeWave { 0%{transform:skewY(-15deg) scale(.7);opacity:0} 50%{transform:skewY(8deg) scale(1.05);opacity:1} 100%{transform:skewY(-4deg) scale(1)} }
    @keyframes titleIn { 0%,58%{transform:translateY(20px);opacity:0} 82%,100%{transform:translateY(0);opacity:1} }
    @keyframes captionIn { 0%,18%{opacity:0;transform:translateY(-13px)} 42%,100%{opacity:1;transform:translateY(0)} }
  </style>
</head>
<body>
  <div id="stage" data-composition-id="perro-galactico" data-start="0" data-duration="5" data-width="1920" data-height="1080">
    <div class="nebula a"></div><div class="nebula b"></div><div class="planet"></div><div class="ring"></div>
    <i class="star s1"></i><i class="star s2"></i><i class="star s3"></i><i class="star s4"></i><i class="star s5"></i><i class="star s6"></i><i class="star s7"></i><i class="star s8"></i><i class="star s9"></i><i class="star s10"></i><i class="star s11"></i><i class="star s12"></i>
    <div class="caption">MISIÓN: EXPLORAR EL UNIVERSO</div>
    <div class="dog-wrap" aria-label="Perro astronauta galáctico">
      <div class="aura"></div><div class="cape"></div><div class="body"></div><div class="leg l1"></div><div class="leg l2"></div>
      <div class="ear left"></div><div class="ear right"></div><div class="dog-head"></div><div class="muzzle"></div><div class="nose"></div><div class="eye left"></div><div class="eye right"></div><div class="collar"></div><div class="tag"></div><div class="helmet"></div>
    </div>
    <div class="title">Perro Galáctico</div>
  </div>
</body>
</html>
