name: Render Carrito Gastro (cloud)

on:
  workflow_dispatch:
  push:
    paths:
      - 'carrito-gastro/**'
      - '.github/workflows/render-carrito-gastro.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: carrito-gastro
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: carrito-gastro/package.json

      # Runs after the first skip the browser download.
      - name: Cache chrome-headless-shell
        uses: actions/cache@v4
        with:
          path: ~/.cache/hfs
          key: hfs-${{ runner.os }}-chrome-headless-shell-stable

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install chrome-headless-shell
        run: |
          BIN=$(find "$HOME/.cache/hfs" -type f -name chrome-headless-shell 2>/dev/null | head -n 1)
          if [ -z "$BIN" ]; then
            npx --yes @puppeteer/browsers install chrome-headless-shell@stable --path "$HOME/.cache/hfs"
            BIN=$(find "$HOME/.cache/hfs" -type f -name chrome-headless-shell | head -n 1)
          fi
          echo "Using browser: $BIN"
          echo "HYPERFRAMES_BROWSER_PATH=$BIN" >> "$GITHUB_ENV"

      # The source is a phone capture whose keyframes sit ~5s apart. Every capture
      # seek then has to re-decode up to 5s of video, which stalls the frame loop.
      # Report the real numbers before touching anything.
      - name: Probe source keyframes
        run: |
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,avg_frame_rate,nb_frames,duration \
            -of default=noprint_wrappers=1 assets/source.mp4
          FRAMES=$(ffprobe -v error -select_streams v:0 -show_entries frame=key_frame \
            -of csv=p=0 assets/source.mp4 | grep -c '')
          KEYS=$(ffprobe -v error -select_streams v:0 -show_entries frame=key_frame \
            -of csv=p=0 assets/source.mp4 | grep -c '^1')
          echo "total_frames=$FRAMES keyframes=$KEYS"
          [ "$KEYS" -gt 0 ] && echo "avg_gop_frames=$((FRAMES / KEYS))"

      # Exactly the re-encode the HyperFrames compiler asks for, at CRF 15 so the
      # extra generation costs no visible quality. Native resolution is kept, so
      # decode stays cheap. Audio is copied bit-for-bit.
      - name: Re-encode source with dense keyframes
        run: |
          mv assets/source.mp4 assets/source.orig.mp4
          # The food-pop look is BAKED into the pixels here instead of using
          # data-color-grading. Measured on this runner, the runtime grading
          # shader costs 28,664 ms/frame on software GL versus 66 ms/frame
          # without it (~450x). Same look, and the render becomes feasible.
          # Tune the look by editing the eq/colorbalance values below.
          ffmpeg -y -v error \
            -i assets/source.orig.mp4 \
            -vf "fps=30,eq=saturation=1.18:contrast=1.07:gamma=1.02,colorbalance=rs=0.04:gs=0.01:bs=-0.04:rm=0.03:gm=0.01:bm=-0.03:rh=0.02:bh=-0.02" \
            -c:v libx264 -r 30 -g 30 -keyint_min 30 \
            -crf 15 -preset medium -pix_fmt yuv420p \
            -movflags +faststart \
            -c:a copy \
            assets/source.mp4
          echo "--- optimized ---"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,avg_frame_rate,nb_frames,duration \
            -of default=noprint_wrappers=1 assets/source.mp4
          ls -la assets/

      # `check` was removed from this pipeline: it cost 42s and `continue-on-error`
      # meant it never blocked the render — a broken composition fails in Render MP4
      # anyway. Run it by hand when editing the composition, not on every render.

      # Read the CLI's own summary line:
      #   beginframe|screenshot capture · gpu · compile Xs · setup Xs · capture Xs · encode Xs
      # --workers: left at auto, on purpose. An A/B on this runner showed
      # workers=2 (61s) beating auto (108s) -- but that A/B ran at
      # --quality draft, where the encoder is fast and the capture loop is the
      # bottleneck. At the production setting (--quality looks, CRF 16) the
      # bottleneck flips: the log's own summary reads
      #   capture 3m 11.2s · encode (during capture) 3m 11.2s
      # i.e. the capture loop and the streaming encoder are locked to the same
      # wall time, and frame throughput is 113 ms/frame with 2 workers versus
      # 115 ms/frame with 1. Extra capture workers just queue behind the encoder.
      #
      # The real lever on render time is the encoder, not the workers:
      #   --quality looks (CRF 16, standard preset) -> capture+encode 191s
      #   --quality draft                           -> ~108s
      # or pin --crf / --video-bitrate directly. The source is 478x850 upscaled
      # to 1080x1920, so CRF 16's 14.5 Mbps carries far more than this material
      # actually holds.
      - name: Render MP4
        run: |
          npx --yes hyperframes@0.8.156 render \
            --fps 30 \
            --quality looks \
            --browser-timeout 300 \
            -o renders/carrito-gastro.mp4

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: carrito-gastro-mp4
          path: carrito-gastro/renders/carrito-gastro.mp4
          if-no-files-found: error
          retention-days: 14
