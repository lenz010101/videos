name: Render Carrito Gastro (cloud)

on:
  workflow_dispatch:
  push:
    paths:
      - 'carrito-gastro/**'
      - '.github/workflows/render-carrito-gastro.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carrito-gastro
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Validate composition
        run: npx --yes hyperframes@0.8.156 check

      - name: Render MP4
        run: npx --yes hyperframes@0.8.156 render --fps 30 --quality high -o renders/carrito-gastro.mp4

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: carrito-gastro-mp4
          path: carrito-gastro/renders/carrito-gastro.mp4
          if-no-files-found: error
          retention-days: 14
