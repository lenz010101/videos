name: Render HyperFrames video

on:
  workflow_dispatch:
  push:
    paths:
      - index.html
      - package.json
      - verify.mjs
      - .github/workflows/render.yml

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Validate composition
        run: npm run verify

      - name: Render MP4
        run: npm run render

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: perro-galactico-mp4
          path: renders/perro-galactico.mp4
          if-no-files-found: error
          retention-days: 7
