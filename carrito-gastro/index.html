<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Carrito Gastronómico — Aesthetic Rework</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Anton";
        src: url("assets/fonts/anton-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }

      :root {
        --fire: #e8412a;
        --fire-deep: #b4240f;
        --amber: #ffc531;
        --cream: #fff6e6;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0a0603;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .stage {
        position: absolute;
        inset: 0;
        will-change: transform;
      }

      #hero {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* ---------- Top brand lockup ---------- */
      .brand {
        position: absolute;
        top: 64px;
        left: 64px;
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 18px 32px;
        background: rgba(15, 9, 5, 0.62);
        border: 1px solid rgba(255, 197, 49, 0.38);
        border-radius: 26px;
        box-shadow:
          0 26px 60px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      .dot {
        display: block;
        width: 52px;
        height: 52px;
        border-radius: 16px;
        background: linear-gradient(140deg, var(--amber), var(--fire));
        box-shadow: 0 0 28px rgba(255, 197, 49, 0.55);
        flex: none;
      }

      .txt {
        display: flex;
        flex-direction: column;
      }

      .name {
        font-family: "Anton", sans-serif;
        font-size: 44px;
        line-height: 1;
        letter-spacing: 0.5px;
        color: var(--cream);
        text-transform: uppercase;
      }

      .handle {
        font-family: "Inter", sans-serif;
        font-weight: 700;
        font-size: 20px;
        letter-spacing: 2px;
        color: var(--amber);
        margin-top: 10px;
        text-transform: uppercase;
      }

      /* ---------- Bottom CTA ---------- */
      .cta {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 104px;
        display: flex;
        justify-content: center;
      }

      .pill {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 22px 44px;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--fire), var(--fire-deep));
        box-shadow:
          0 24px 55px rgba(232, 65, 42, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.25);
      }

      .k {
        font-family: "Inter", sans-serif;
        font-weight: 700;
        font-size: 24px;
        letter-spacing: 1px;
        color: var(--amber);
        text-transform: uppercase;
      }

      .v {
        font-family: "Anton", sans-serif;
        font-size: 38px;
        letter-spacing: 1px;
        color: var(--cream);
        text-transform: uppercase;
      }

      /* ---------- Bottom progress rail ---------- */
      .progress {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 8px;
        background: rgba(255, 246, 230, 0.14);
      }

      .progress .bar {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: left center;
        background: linear-gradient(90deg, var(--amber), var(--fire));
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="55.4"
    >
      <div class="stage">
        <video
          id="hero"
          src="assets/source.mp4"
          playsinline
          data-has-audio="true"
          data-start="0"
          data-duration="55.4"
          data-track-index="0"
          data-volume="1"
          data-color-grading='{"preset":"food-pop","intensity":1}'
        ></video>
      </div>

      <div id="brand" class="clip" data-start="0.5" data-duration="54.9">
        <span class="brand">
          <span class="dot"></span>
          <span class="txt">
            <span class="name">Tu Marca</span>
            <span class="handle">@tumarca · carrito gastronómico</span>
          </span>
        </span>
      </div>

      <div id="cta" class="clip" data-start="3.4" data-duration="52">
        <span class="cta">
          <span class="pill">
            <span class="k">Pide por</span>
            <span class="v">WhatsApp</span>
          </span>
        </span>
      </div>

      <div class="progress"><span class="bar"></span></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Reframe: slow, continuous push-and-drift across the whole clip.
      tl.fromTo(
        ".stage",
        { scale: 1.02, xPercent: 0, yPercent: 0 },
        { scale: 1.075, xPercent: -1.5, yPercent: -1, duration: 20, ease: "sine.inOut" },
        0,
      );
      tl.to(
        ".stage",
        { scale: 1.035, xPercent: 1.5, yPercent: 1, duration: 18, ease: "sine.inOut" },
        20,
      );
      tl.to(
        ".stage",
        { scale: 1.09, xPercent: -1, yPercent: -1.2, duration: 17, ease: "sine.inOut" },
        38,
      );

      // Brand lockup entrance.
      tl.fromTo(
        ".brand",
        { y: -30, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.9, ease: "power4.out" },
        0.5,
      );

      // CTA entrance.
      tl.fromTo(
        ".pill",
        { y: 46, scale: 0.94, autoAlpha: 0 },
        { y: 0, scale: 1, autoAlpha: 1, duration: 0.9, ease: "expo.out" },
        3.4,
      );

      // Micro-interaction: brand dot breathes.
      tl.to(
        ".dot",
        { scale: 1.14, duration: 1.3, repeat: 3, yoyo: true, ease: "sine.inOut" },
        6,
      );

      // Progress rail.
      tl.fromTo(".bar", { scaleX: 0 }, { scaleX: 1, duration: 55.4, ease: "none" }, 0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
